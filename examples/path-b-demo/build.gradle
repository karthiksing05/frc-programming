/* GradleRIO + AdvantageKit + JUnit 5.
 *
 * Compatible with WPILib 2026 (Java 17). This is the season's worth of
 * config — the rest of the time we only touch lesson code.
 */
plugins {
    id 'java'
    id 'edu.wpi.first.GradleRIO' version '2026.2.1'
    id 'com.diffplug.spotless' version '6.25.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            team    = project.frc.getTeamOrDefault(0)
            debug   = project.frc.getDebugOrDefault(false)
            artifacts.register('frcJava', getArtifactTypeClass('FRCJavaArtifact')) {}
        }
    }
}

wpi.java {
    debugJni = false
    /* CRUCIAL: lets `simulateJava` + `test` use desktop classifier deps.
       Without this, lessons that depend on simulation classes won't even
       compile. New WPILib projects ask this at creation time. */
    configureExecutableTasks = true
}

repositories {
    mavenCentral()
    /* AdvantageKit Maven repo (vendordep also installs it, but pin
       explicitly so CI builds reproduce). */
    maven { url 'https://maven.advantagekit.org' }
}

dependencies {
    /* WPILib + vendordeps */
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    /* AdvantageKit's @AutoLog annotation processor.
       The vendordep also wires this, but we list it for clarity. */
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$wpi.versions.advantageKitVersion"

    /* JUnit 5 for lesson tests */
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher:1.10.2'

    /* Simulation deps (also pulled in by configureExecutableTasks) */
    simulationDebug wpi.sim.enableDebug()
    simulationRelease wpi.sim.enableRelease()
}

test {
    useJUnitPlatform()
    /* Run ALL lesson tags by default; the frcprog CLI passes
       --tests '*Lesson01*' etc. for per-lesson runs. */
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
}

jar {
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

/* Per-lesson convenience tasks the frcprog CLI shells out to.
   Pattern: ./gradlew lesson01, lesson02, ... runs that lesson's tagged tests. */
[
    '01': 'Methods (Functions) — applyDeadband',
    '02': 'Tank Drive — DriveSubsystem wiring',
].each { num, title ->
    tasks.register("lesson${num}") {
        group = 'lessons'
        description = "Run lesson ${num} rubric: ${title}"
        dependsOn 'test'
        doFirst {
            test.useJUnitPlatform { includeTags "lesson-${num}" }
        }
    }
}
