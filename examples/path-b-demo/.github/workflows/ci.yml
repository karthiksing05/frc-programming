# Per WPILib's own CI guidance: use the roborio-cross-ubuntu image so
# we get a pre-installed JDK + roboRIO cross toolchain. Cold builds take
# ~2-5 min; warm cache hits 30-90 s.
#
# https://docs.wpilib.org/en/stable/docs/software/advanced-gradlerio/robot-code-ci.html
name: Lesson CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run all lesson rubrics
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2026-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build & test
        run: ./gradlew --no-daemon check

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'build/test-results/test/*.xml'
          fail_on_failure: true
          include_passed: true

      # Future: replace the JUnit summary with a sticky PR comment that
      # parses lessons/manifest.json + test results into a per-lesson
      # checklist. Stub left as a hint.
