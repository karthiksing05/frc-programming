# ─────────────────────────────────────────────────────────────────────────────
#  Gradle + curriculum configuration
# ─────────────────────────────────────────────────────────────────────────────

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# NOTE: offline mode is NOT configured here. Gradle silently ignores an
# `org.gradle.offline` property in this file — it is only settable from the
# command line or from settings.gradle, and we do it in settings.gradle so that
# VS Code's WPILib buttons get it too. See the comment at the bottom of
# settings.gradle.

# ─── Version pins ────────────────────────────────────────────────────────────
# Read by tools/frcprog doctor so it can tell you when your WPILib install and
# this project disagree. Do NOT bump these without re-running `./gradlew
# lessonAll` against the exemplars — WPILib makes breaking changes every
# January and lessons must be re-validated. See process/Path-B-Implementation.md
# §6.1 (the kickoff ritual).
wpiVersion=2026.2.1
junitVersion=5.10.1
