site_name: FRCProgramming.org
site_url: http://localhost:8000
site_description: A comprehensive learning guide for FRC robot programming. Like FRCDesign, but for programming.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.footer
    - navigation.prune
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - header.autohide
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  icon:
    logo: fontawesome/solid/code

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search
  - glightbox

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Learn:
      - learn/index.md
      - Stage 0 — Onboarding:
          - "0A — First-run install": learn/stage0/0a-install/index.md
          - "0B — Meet Presto": learn/stage0/0b-meet-presto/index.md
          - "0C — Meet Kelpie": learn/stage0/0c-meet-kelpie/index.md
          - "0D — Git + project tour": learn/stage0/0d-git-tour/index.md
      - Stage 1A — Java fundamentals:
          - "01 — Methods (Functions)": learn/stage1a/01-methods/index.md
          - "02 — Variables & types": learn/stage1a/02-variables-and-types/index.md
          - "03 — Conditionals in teleopPeriodic": learn/stage1a/03-conditionals-in-teleop/index.md
      - Stage 1B — Subsystems & PID:
          - "04 — Subsystems as state machines": learn/stage1b/04-subsystems-state-machines/index.md
          - "05 — PID introduction (Elevator)": learn/stage1b/05-pid-elevator/index.md
          - "06 — Arm with gravity feedforward": learn/stage1b/06-arm-gravity-ff/index.md
      - "Graduate to VS Code": graduate/index.md
      - Stage 1C — My first robot:
          - "07 — Tank drive wiring (factories)": learn/stage1c/07-tank-drive/index.md
          - "08 — Joystick bindings & Triggers": learn/stage1c/08-triggers-bindings/index.md
          - "09 — Command composition": learn/stage1c/09-command-composition/index.md
          - "10 — Telemetry & AdvantageScope basics": learn/stage1c/10-telemetry/index.md
      - Stage 1D — Composition, autos, refactoring:
          - "11 — Default commands done right": learn/stage1d/11-default-commands/index.md
          - "12 — Auto routines (basic)": learn/stage1d/12-auto-basic/index.md
          - "13 — Path-following intro": learn/stage1d/13-path-following/index.md
          - "14 — Refactoring with *Bindings classes": learn/stage1d/14-bindings-refactor/index.md
          - "15 — Capstone teleop robot": learn/stage1d/15-capstone-teleop/index.md
      - Stage 2A — AdvantageKit & mechanism mastery:
          - "16 — The IO Layer pattern": learn/stage2a/16-io-layer/index.md
          - "17 — AdvantageScope first-class": learn/stage2a/17-advantagescope/index.md
          - "18 — AdvantageKit logging discipline": learn/stage2a/18-logging-discipline/index.md
          - "19 — Log replay for debugging": learn/stage2a/19-log-replay/index.md
          - "20 — Subsystem composition at scale": learn/stage2a/20-superstructure/index.md
      - Stage 2B — Swerve & trajectories:
          - "21 — Swerve drivetrain (intro)": learn/stage2b/21-swerve-intro/index.md
          - "22 — Odometry & pose estimation": learn/stage2b/22-odometry/index.md
          - "23 — Trajectory following": learn/stage2b/23-trajectories/index.md
      - Stage 2C — Vision:
          - "24 — PhotonVision single-tag": learn/stage2c/24-photonvision-singletag/index.md
          - "25 — Multi-tag pose estimation": learn/stage2c/25-multitag/index.md
          - "26 — maple-sim & game-piece physics": learn/stage2c/26-maplesim/index.md
      - Stage 2D — Advanced control & capstone:
          - "27 — Motion profiling": learn/stage2d/27-motion-profiling/index.md
          - "28 — System identification (SysId)": learn/stage2d/28-sysid/index.md
          - "29 — Advanced state machines": learn/stage2d/29-state-machines/index.md
          - "30 — Season capstone": learn/stage2d/30-season-capstone/index.md
  - Robots:
      - robots/index.md
      - Reefscape tour (Kelpie): robots/kelpie-reefscape-tour.md
      - Crescendo tour (Presto): robots/presto-crescendo-tour.md
  - Programming Handbook:
      - handbook/index.md
  - Examples:
      - code-examples/index.md
  - About: about.md
  - Contributing: contributing.md
