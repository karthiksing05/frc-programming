site_name: FRCProgramming
site_description: >-
  An offline FRC robot programming curriculum. Real Java, real WPILib, real
  simulation, graded locally — no network, no accounts, no server.

# Served from your own machine. `./tools/frcprog site`, or site/serve.sh.
site_url: http://localhost:8000
use_directory_urls: true

docs_dir: docs
site_dir: _site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.prune
    - navigation.top
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  icon:
    logo: fontawesome/solid/robot

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - search

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # ───────────────────────────────────────────────────────────────────────────
  #  The most important extension in this file.
  #
  #  Every lesson page on this site is a thin wrapper that INCLUDES the canonical
  #  lesson text and the real source files out of ../curriculum/. Nothing is
  #  copied. That means the site and the project a student is actually editing
  #  cannot drift apart — the usual failure mode for a curriculum with both a
  #  website and a repository.
  #
  #  check_paths makes a missing include a build error rather than a silently
  #  empty page.
  # ───────────────────────────────────────────────────────────────────────────
  - pymdownx.snippets:
      base_path:
        - ..
        - docs
      check_paths: true

