<title>FRCProgramming — the offline curriculum</title>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Tokens.

   Three theme states, and all three are handled: the bare :root carries the
   complete light palette; the prefers-color-scheme block redefines only tokens
   and is guarded so an explicit light choice beats a dark OS; the [data-theme]
   block redefines them again so the toggle wins in both directions. No colour
   is ever declared only inside a media or [data-theme] block.

   Neutrals are blue-grey — the colour of an anodized gearbox plate — rather
   than a pure grey, and the single accent is signal amber, which is the safety
   colour on every FRC field element.
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --bg:        #F2F4F6;
  --surface:   #FFFFFF;
  --sunken:    #E9EDF1;
  --ink:       #151A20;
  --ink-soft:  #38414D;
  --muted:     #5A6472;
  --faint:     #8B94A1;
  --line:      #DCE1E7;
  --line-soft: #E7EBEF;

  --accent:      #A85D00;
  --accent-ink:  #7A4400;
  --accent-wash: #FBF1E2;

  --info:   #2E6DA8;  --info-wash:   #E8F0F8;
  --tip:    #2C7A57;  --tip-wash:    #E6F3EC;
  --warn:   #A85D00;  --warn-wash:   #FBF1E2;
  --danger: #B3402E;  --danger-wash: #FBECE9;

  --code-bg: #F5F7F9;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --rail: 300px;
  --toc: 220px;
  --measure: 68ch;
  --radius: 3px;
}

:root:not([data-theme="light"]) {
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #0E1216;
    --surface:   #161B21;
    --sunken:    #12171C;
    --ink:       #E7EBEF;
    --ink-soft:  #C3CBD4;
    --muted:     #8F99A6;
    --faint:     #6B7583;
    --line:      #242B34;
    --line-soft: #1C222A;

    --accent:      #F0A93C;
    --accent-ink:  #F9CE8C;
    --accent-wash: #241C10;

    --info:   #5EA3E0;  --info-wash:   #131E29;
    --tip:    #5CBE92;  --tip-wash:    #12211A;
    --warn:   #F0A93C;  --warn-wash:   #241C10;
    --danger: #E8735C;  --danger-wash: #271713;

    --code-bg: #11161B;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:        #0E1216;
  --surface:   #161B21;
  --sunken:    #12171C;
  --ink:       #E7EBEF;
  --ink-soft:  #C3CBD4;
  --muted:     #8F99A6;
  --faint:     #6B7583;
  --line:      #242B34;
  --line-soft: #1C222A;

  --accent:      #F0A93C;
  --accent-ink:  #F9CE8C;
  --accent-wash: #241C10;

  --info:   #5EA3E0;  --info-wash:   #131E29;
  --tip:    #5CBE92;  --tip-wash:    #12211A;
  --warn:   #F0A93C;  --warn-wash:   #241C10;
  --danger: #E8735C;  --danger-wash: #271713;

  --code-bg: #11161B;
}

/* ─── Base ───────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ─── Frame ──────────────────────────────────────────────────────────────── */
.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 52px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.wordmark {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}
.wordmark b { font-weight: 700; }
.wordmark span {
  color: var(--faint);
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.masthead-spacer { flex: 1; }

.searchwrap { position: relative; width: min(340px, 42vw); }
#search {
  width: 100%;
  height: 32px;
  padding: 0 30px 0 10px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink);
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
#search::placeholder { color: var(--faint); }
.searchwrap kbd {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--faint);
  pointer-events: none;
}

.iconbtn {
  display: grid;
  place-items: center;
  width: 32px; height: 32px;
  color: var(--muted);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 13px;
}
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }

#menubtn { display: none; }

.layout {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr) var(--toc);
  align-items: start;
}

/* ─── Left rail: the channel list ────────────────────────────────────────
   Styled as an instrument channel list rather than a generic doc sidebar:
   monospace, tabular lesson numbers, and a status column using the same
   glyph vocabulary `frcprog list` prints in a terminal. The numbering is a
   real sequence, so numbering it is information rather than decoration. */
.rail {
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
  padding: 22px 0 60px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  font-family: var(--mono);
  font-size: 12.5px;
}

.rail-section { margin-bottom: 26px; }

.rail-head {
  padding: 0 18px 7px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
}

.rail-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 13px 18px 5px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.rail-group::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line-soft);
}

.navitem {
  display: grid;
  grid-template-columns: 14px 22px 1fr;
  gap: 8px;
  align-items: baseline;
  width: 100%;
  padding: 4px 18px 4px 14px;
  text-align: left;
  color: var(--ink-soft);
  background: none;
  border: 0;
  border-left: 2px solid transparent;
  cursor: pointer;
  font: inherit;
  line-height: 1.45;
}
.navitem:hover { background: var(--sunken); color: var(--ink); }
.navitem[aria-current="page"] {
  border-left-color: var(--accent);
  background: var(--accent-wash);
  color: var(--ink);
  font-weight: 700;
}
.navitem .glyph { color: var(--faint); text-align: center; }
.navitem[aria-current="page"] .glyph { color: var(--accent); }
.navitem .num {
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.navitem[aria-current="page"] .num { color: var(--accent); }
.navitem .label { min-width: 0; }
.navitem.plain { grid-template-columns: 1fr; padding-left: 32px; }

/* ─── Content column ─────────────────────────────────────────────────────── */
.main { min-width: 0; padding: 0 44px 120px; }
.doc { max-width: var(--measure); margin: 0 auto; }

.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 30px 0 0;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--faint);
}
.crumb .sep { color: var(--line); }

.chipline { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.chip {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  color: var(--muted);
}
.chip.graded    { color: var(--tip);    border-color: var(--tip);    background: var(--tip-wash); }
.chip.guided    { color: var(--info);   border-color: var(--info);   background: var(--info-wash); }
.chip.extension { color: var(--warn);   border-color: var(--warn);   background: var(--warn-wash); }

/* Typography ------------------------------------------------------------- */
.doc h1 {
  margin: 12px 0 0;
  font-size: 40px;
  line-height: 1.12;
  letter-spacing: -0.02em;
  font-weight: 700;
  text-wrap: balance;
}
.doc h1 + blockquote { margin-top: 18px; }

.doc h2 {
  margin: 52px 0 0;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 24px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  font-weight: 700;
  text-wrap: balance;
}
.doc h3 {
  margin: 34px 0 0;
  font-size: 18px;
  line-height: 1.35;
  font-weight: 700;
  text-wrap: balance;
}
.doc h4 {
  margin: 26px 0 0;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.doc p { margin: 16px 0 0; }
.doc ul, .doc ol { margin: 16px 0 0; padding-left: 24px; }
.doc li { margin: 6px 0 0; }
.doc li > ul, .doc li > ol { margin-top: 6px; }
.doc hr { margin: 44px 0 0; border: 0; border-top: 1px solid var(--line); }
.doc strong { font-weight: 700; color: var(--ink); }

.doc blockquote {
  margin: 20px 0 0;
  padding: 2px 0 2px 18px;
  border-left: 2px solid var(--accent);
  color: var(--ink-soft);
}
.doc blockquote p:first-child { margin-top: 0; }

/* Definition lists are used for the frcprog command reference. */
.doc dl { margin: 20px 0 0; }
.doc dt {
  margin-top: 18px;
  font-family: var(--mono);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
}
.doc dd { margin: 4px 0 0 0; padding-left: 18px; border-left: 1px solid var(--line); color: var(--ink-soft); }

/* Tables ----------------------------------------------------------------- */
.tablewrap { overflow-x: auto; margin: 22px 0 0; border: 1px solid var(--line); border-radius: var(--radius); }
.doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.doc th, .doc td {
  padding: 9px 13px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line-soft);
}
.doc thead th {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--sunken);
  white-space: nowrap;
}
.doc tbody tr:last-child td { border-bottom: 0; }
.doc td:first-child { font-variant-numeric: tabular-nums; }

/* Code ------------------------------------------------------------------- */
.doc code {
  font-family: var(--mono);
  font-size: 0.875em;
  padding: 1px 5px;
  background: var(--sunken);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  overflow-wrap: break-word;
}
.doc pre {
  margin: 0;
  padding: 14px 16px;
  overflow-x: auto;
  background: var(--code-bg);
  font-size: 13px;
  line-height: 1.6;
}
.doc pre code {
  padding: 0;
  background: none;
  border: 0;
  font-size: inherit;
  white-space: pre;
}
.doc .highlight,
.doc pre:not(.highlight pre) {
  margin: 22px 0 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.doc .highlight pre { margin: 0; border: 0; }

/* A source file lifted straight out of the project. */
.srcfile figure { margin: 22px 0 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.srcfile figcaption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 13px;
  background: var(--sunken);
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.srcfile figcaption .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srcfile figcaption .lang { color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; flex: none; }
.srcfile pre { max-height: 30em; overflow: auto; }

/* Admonitions ------------------------------------------------------------ */
.admonition {
  margin: 24px 0 0;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--muted);
  border-radius: var(--radius);
}
.admonition > :first-child { margin-top: 0; }
.admonition-title {
  margin: 0 0 2px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--muted);
}
.admonition.note, .admonition.info, .admonition.abstract { border-left-color: var(--info); background: var(--info-wash); }
.admonition.note .admonition-title,
.admonition.info .admonition-title,
.admonition.abstract .admonition-title { color: var(--info); }
.admonition.tip, .admonition.success { border-left-color: var(--tip); background: var(--tip-wash); }
.admonition.tip .admonition-title, .admonition.success .admonition-title { color: var(--tip); }
.admonition.warning { border-left-color: var(--warn); background: var(--warn-wash); }
.admonition.warning .admonition-title { color: var(--warn); }
.admonition.danger, .admonition.error { border-left-color: var(--danger); background: var(--danger-wash); }
.admonition.danger .admonition-title, .admonition.error .admonition-title { color: var(--danger); }

/* Collapsible blocks — the code, the rubric, the hints. */
.doc details {
  margin: 22px 0 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.doc details[open] { border-color: var(--muted); }
.doc details > summary {
  padding: 11px 15px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink);
  list-style: none;
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.doc details > summary::-webkit-details-marker { display: none; }
.doc details > summary::before {
  content: "+";
  color: var(--accent);
  font-weight: 700;
  flex: none;
  width: 10px;
}
.doc details[open] > summary::before { content: "\2212"; }
.doc details > summary:hover { background: var(--sunken); }
.doc details > *:not(summary) { padding: 0 15px; }
.doc details > *:not(summary):last-child { padding-bottom: 15px; }
.doc details .highlight,
.doc details .srcfile figure,
.doc details .admonition,
.doc details details { margin-left: 0; margin-right: 0; }
.doc details details { margin-top: 18px; }

/* Buttons in prose ------------------------------------------------------- */
.doc .md-button {
  display: inline-block;
  margin: 18px 8px 0 0;
  padding: 8px 15px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--accent);
  text-decoration: none;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
}
.doc .md-button:hover { background: var(--accent-wash); }
.doc .md-button--primary { background: var(--accent); color: var(--surface); }
:root[data-theme="dark"] .doc .md-button--primary { color: #0E1216; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .doc .md-button--primary { color: #0E1216; }
}
.doc .md-button--primary:hover { filter: brightness(1.08); background: var(--accent); }

/* Material's card grids degrade to a plain list here, which reads fine. */
.doc .grid { display: grid; gap: 16px; margin-top: 20px; }
@media (min-width: 720px) { .doc .grid.cards { grid-template-columns: 1fr 1fr; } }
.doc .grid > ul { margin: 0; padding: 0; list-style: none; display: contents; }
.doc .grid.cards > ul > li {
  margin: 0;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.doc .grid.cards > ul > li > hr { display: none; }
.doc .grid.cards > ul > li > p:first-child { margin-top: 0; font-weight: 700; }

.doc .tabbed-set { margin-top: 22px; }
.doc .tabbed-labels { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.doc .tabbed-labels label {
  padding: 7px 12px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.doc .tabbed-set input { display: none; }
.doc .tabbed-content { padding-top: 4px; }

/* ─── Footer nav ─────────────────────────────────────────────────────────── */
.pagenav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 56px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.pagenav a {
  padding: 13px 15px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  text-decoration: none;
  background: var(--surface);
}
.pagenav a:hover { border-color: var(--accent); }
.pagenav a.next { text-align: right; }
.pagenav .dir {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
}
.pagenav .name { display: block; margin-top: 3px; color: var(--ink); font-size: 14.5px; }

/* ─── Right rail: on-page contents ───────────────────────────────────────── */
.toc {
  position: sticky;
  top: 52px;
  max-height: calc(100vh - 52px);
  overflow-y: auto;
  padding: 34px 20px 60px 0;
  font-family: var(--mono);
  font-size: 11.5px;
}
.toc-head {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  padding-bottom: 8px;
}
.toc a {
  display: block;
  padding: 3px 0 3px 11px;
  border-left: 1px solid var(--line);
  color: var(--muted);
  text-decoration: none;
  line-height: 1.4;
}
.toc a:hover { color: var(--ink); border-left-color: var(--muted); }
.toc a.lvl3 { padding-left: 22px; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ─── Search results ─────────────────────────────────────────────────────── */
#results {
  position: absolute;
  top: 40px;
  right: 0;
  width: min(520px, 84vw);
  max-height: 66vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 12px 32px rgb(0 0 0 / 0.18);
  z-index: 60;
}
#results:empty { display: none; }
.result {
  display: block;
  width: 100%;
  padding: 11px 14px;
  text-align: left;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  font: inherit;
  color: var(--ink);
}
.result:hover, .result.sel { background: var(--accent-wash); }
.result .rt { font-size: 14px; font-weight: 700; }
.result .rs {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faint);
}
.result .rx { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.result mark { background: var(--accent-wash); color: var(--accent-ink); padding: 0 1px; }
.noresult { padding: 16px; color: var(--muted); font-size: 13.5px; }

/* ─── Responsive ─────────────────────────────────────────────────────────── */
@media (max-width: 1240px) {
  .layout { grid-template-columns: var(--rail) minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #menubtn { display: grid; }
  .rail {
    position: fixed;
    top: 52px; left: 0;
    width: min(320px, 86vw);
    z-index: 50;
    transform: translateX(-102%);
    transition: transform 0.18s ease;
    box-shadow: 0 0 40px rgb(0 0 0 / 0.2);
  }
  body.nav-open .rail { transform: none; }
  .main { padding: 0 22px 100px; }
  .scrim {
    position: fixed;
    inset: 52px 0 0;
    background: rgb(0 0 0 / 0.35);
    z-index: 45;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
}
@media (max-width: 620px) {
  .doc h1 { font-size: 30px; }
  .doc h2 { font-size: 20px; }
  .wordmark span { display: none; }
  .pagenav { grid-template-columns: 1fr; }
  .main { padding: 0 16px 80px; }
}

/* Pygments token colours, theme-aware. Declared through tokens so the same
   rules serve both themes. */
/*__PYGMENTS__*/
</style>

  <button class="iconbtn" id="menubtn" aria-label="Open navigation" aria-expanded="false">≡</button>
  <a class="wordmark" href="#/index">
    <b>FRCProgramming</b><span>offline curriculum</span>
  </a>
  <div class="masthead-spacer"></div>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search 53 pages…" autocomplete="off"
           aria-label="Search the curriculum" aria-controls="results" />
    <kbd>/</kbd>
    <div id="results" role="listbox" aria-label="Search results"></div>
  </div>
  <button class="iconbtn" id="themebtn" aria-label="Switch theme" title="Switch theme">◐</button>
</header>

<div class="scrim" id="scrim"></div>

<div class="layout">
  <nav class="rail" id="rail" aria-label="Curriculum contents"></nav>
  <main class="main">
    <article class="doc" id="doc"></article>
  </main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<script type="application/json" id="payload">/*__DATA__*/</script>

<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("payload").textContent);
  var PAGES = DATA.pages, ORDER = DATA.order, SECTIONS = DATA.sections, FILES = DATA.files;

  var docEl = document.getElementById("doc");
  var railEl = document.getElementById("rail");
  var tocEl = document.getElementById("toc");
  var searchEl = document.getElementById("search");
  var resultsEl = document.getElementById("results");

  /* ── Theme ────────────────────────────────────────────────────────────
     Cycles system → light → dark. "System" is the default and is the state
     where no attribute is stamped, so the media query governs. */
  var themebtn = document.getElementById("themebtn");
  var THEMES = [null, "light", "dark"];
  var themeIdx = 0;
  themebtn.addEventListener("click", function () {
    themeIdx = (themeIdx + 1) % THEMES.length;
    var t = THEMES[themeIdx];
    if (t) { document.documentElement.setAttribute("data-theme", t); }
    else { document.documentElement.removeAttribute("data-theme"); }
    themebtn.textContent = t === "light" ? "☀" : t === "dark" ? "☾" : "◐";
    themebtn.title = "Theme: " + (t || "system");
  });

  /* ── Navigation rail ──────────────────────────────────────────────────
     Lesson rows get a status glyph, a tabular number, and a title — the same
     three columns `frcprog list` prints. Non-lesson pages get a plain row so
     the number column does not imply a sequence that is not there. */
  var GLYPH = { graded: "○", guided: "◇", extension: "⬇" };

  function buildRail() {
    var frag = document.createDocumentFragment();

    SECTIONS.forEach(function (section) {
      var sec = document.createElement("div");
      sec.className = "rail-section";

      var head = document.createElement("div");
      head.className = "rail-head";
      head.textContent = section.title;
      sec.appendChild(head);

      var lastGroup = null;
      section.pages.forEach(function (entry) {
        var page = PAGES[entry.id];
        if (entry.group && entry.group !== lastGroup) {
          lastGroup = entry.group;
          var g = document.createElement("div");
          g.className = "rail-group";
          g.appendChild(document.createTextNode(entry.group));
          sec.appendChild(g);
        }

        var btn = document.createElement("button");
        btn.className = "navitem";
        btn.dataset.id = entry.id;
        btn.type = "button";

        if (page.status) {
          var glyph = document.createElement("span");
          glyph.className = "glyph";
          glyph.textContent = GLYPH[page.status] || "○";
          glyph.setAttribute("aria-hidden", "true");
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = page.num || "";
          var label = document.createElement("span");
          label.className = "label";
          label.textContent = entry.title.replace(/^[0-9A-Z]+\s*·\s*/, "");
          btn.appendChild(glyph);
          btn.appendChild(num);
          btn.appendChild(label);
          btn.title = entry.title + " — " + page.status +
            (page.minutes ? ", about " + page.minutes + " min" : "");
        } else {
          btn.className = "navitem plain";
          btn.textContent = entry.title;
        }

        btn.addEventListener("click", function () { go(entry.id); });
        sec.appendChild(btn);
      });

      frag.appendChild(sec);
    });

    railEl.appendChild(frag);
  }

  /* ── Link rewriting ───────────────────────────────────────────────────
     The markdown carries relative MkDocs paths. Resolve each against the
     current page's directory and map it onto an in-page route; anything that
     does not resolve to a known page is left alone as an external link. */
  function resolveTarget(fromId, href) {
    if (/^[a-z]+:/i.test(href) || href.charAt(0) === "#") { return null; }
    var base = fromId.split("/").slice(0, -1);
    var clean = href.split("#")[0].split("?")[0];
    var hash = href.indexOf("#") >= 0 ? href.slice(href.indexOf("#")) : "";

    clean = clean.replace(/index\.md$/, "").replace(/\.md$/, "").replace(/\/$/, "");
    clean.split("/").forEach(function (part) {
      if (part === "" || part === ".") { return; }
      if (part === "..") { base.pop(); }
      else { base.push(part); }
    });

    var id = base.join("/");
    if (PAGES[id]) { return { id: id, hash: hash }; }
    if (PAGES[id + "/index"]) { return { id: id + "/index", hash: hash }; }
    return null;
  }

  function wireLinks(root, pageId) {
    root.querySelectorAll("a[href]").forEach(function (a) {
      var href = a.getAttribute("href");
      if (href.charAt(0) === "#") { return; }
      var t = resolveTarget(pageId, href);
      if (t) {
        a.setAttribute("href", "#/" + t.id);
        a.addEventListener("click", function (e) {
          e.preventDefault();
          go(t.id, t.hash ? t.hash.slice(1) : null);
        });
      } else if (/^[a-z]+:/i.test(href)) {
        a.setAttribute("target", "_blank");
        a.setAttribute("rel", "noopener noreferrer");
      }
    });
  }

  /* ── Rendering ────────────────────────────────────────────────────────── */
  function hydrateSources(root) {
    root.querySelectorAll(".srcfile").forEach(function (slot) {
      var src = slot.dataset.src;
      var code = FILES[src];
      if (code == null) { slot.textContent = "Missing source: " + src; return; }

      var fig = document.createElement("figure");
      var cap = document.createElement("figcaption");
      var path = document.createElement("span");
      path.className = "path";
      path.textContent = src.replace(/^curriculum\//, "");
      var lang = document.createElement("span");
      lang.className = "lang";
      lang.textContent = slot.dataset.lang || "";
      cap.appendChild(path);
      cap.appendChild(lang);

      var pre = document.createElement("pre");
      pre.className = "hl";
      var c = document.createElement("code");
      c.innerHTML = code;
      pre.appendChild(c);

      fig.appendChild(cap);
      fig.appendChild(pre);
      slot.appendChild(fig);
    });
  }

  function wrapTables(root) {
    root.querySelectorAll("table").forEach(function (t) {
      if (t.parentElement && t.parentElement.classList.contains("tablewrap")) { return; }
      var w = document.createElement("div");
      w.className = "tablewrap";
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  }

  function buildToc(page, pageId) {
    tocEl.innerHTML = "";
    var visible = (page.toc || []).filter(function (t) {
      var el = document.getElementById(t.id);
      return el && !el.closest("details");
    });
    if (visible.length < 2) { return; }
    var head = document.createElement("div");
    head.className = "toc-head";
    head.textContent = "On this page";
    tocEl.appendChild(head);
    visible.forEach(function (t) {
      var a = document.createElement("a");
      a.href = "#" + t.id;
      a.textContent = t.name;
      if (t.level === 3) { a.className = "lvl3"; }
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var target = document.getElementById(t.id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          history.replaceState(null, "", "#/" + pageId);
        }
      });
      tocEl.appendChild(a);
    });
  }

  function buildPageNav(pageId) {
    var i = ORDER.indexOf(pageId);
    if (i < 0) { return null; }
    var nav = document.createElement("nav");
    nav.className = "pagenav";

    function link(id, dir, cls) {
      var a = document.createElement("a");
      a.className = cls;
      a.href = "#/" + id;
      var d = document.createElement("span");
      d.className = "dir";
      d.textContent = dir;
      var n = document.createElement("span");
      n.className = "name";
      n.textContent = PAGES[id].title;
      a.appendChild(d);
      a.appendChild(n);
      a.addEventListener("click", function (e) { e.preventDefault(); go(id); });
      return a;
    }

    if (i > 0) { nav.appendChild(link(ORDER[i - 1], "Previous", "prev")); }
    else { nav.appendChild(document.createElement("span")); }
    if (i < ORDER.length - 1) { nav.appendChild(link(ORDER[i + 1], "Next", "next")); }
    return nav;
  }

  function render(pageId, anchor) {
    var page = PAGES[pageId];
    if (!page) { return; }

    docEl.innerHTML = "";

    var crumb = document.createElement("div");
    crumb.className = "crumb";
    crumb.appendChild(document.createTextNode(page.section));
    if (page.group) {
      var s = document.createElement("span");
      s.className = "sep";
      s.textContent = "/";
      crumb.appendChild(s);
      crumb.appendChild(document.createTextNode(page.group));
    }
    docEl.appendChild(crumb);

    if (page.status) {
      var chips = document.createElement("div");
      chips.className = "chipline";
      var kind = document.createElement("span");
      kind.className = "chip " + page.status;
      kind.textContent =
        page.status === "graded" ? "Graded rubric" :
        page.status === "extension" ? "Needs one download" : "Guided";
      chips.appendChild(kind);
      if (page.stage) {
        var st = document.createElement("span");
        st.className = "chip";
        st.textContent = "Stage " + page.stage;
        chips.appendChild(st);
      }
      if (page.minutes) {
        var mn = document.createElement("span");
        mn.className = "chip";
        mn.textContent = "~" + page.minutes + " min";
        chips.appendChild(mn);
      }
      docEl.appendChild(chips);
    }

    var body = document.createElement("div");
    body.innerHTML = page.html;
    hydrateSources(body);
    wrapTables(body);
    wireLinks(body, pageId);
    while (body.firstChild) { docEl.appendChild(body.firstChild); }

    var pn = buildPageNav(pageId);
    if (pn) { docEl.appendChild(pn); }

    buildToc(page, pageId);

    railEl.querySelectorAll(".navitem").forEach(function (b) {
      if (b.dataset.id === pageId) { b.setAttribute("aria-current", "page"); }
      else { b.removeAttribute("aria-current"); }
    });

    document.title = page.title + " — FRCProgramming";

    if (anchor) {
      var target = document.getElementById(anchor);
      if (target) { target.scrollIntoView(); return; }
    }
    window.scrollTo(0, 0);

    var active = railEl.querySelector('[aria-current="page"]');
    if (active && active.scrollIntoView) {
      var r = active.getBoundingClientRect();
      if (r.top < 60 || r.bottom > window.innerHeight) {
        active.scrollIntoView({ block: "center" });
      }
    }
  }

  function go(pageId, anchor) {
    document.body.classList.remove("nav-open");
    closeSearch();
    if (location.hash !== "#/" + pageId) {
      history.pushState(null, "", "#/" + pageId);
    }
    render(pageId, anchor);
  }

  /* ── Search ───────────────────────────────────────────────────────────── */
  var INDEX = ORDER.map(function (id) {
    var p = PAGES[id];
    return {
      id: id,
      title: p.title,
      section: p.section + (p.group ? " / " + p.group : ""),
      hay: (p.title + " " + p.section + " " + (p.group || "") + " " + p.text).toLowerCase()
    };
  });

  var selected = -1;

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function excerpt(hay, q) {
    var i = hay.indexOf(q);
    if (i < 0) { return ""; }
    var start = Math.max(0, i - 60);
    var raw = hay.slice(start, i + q.length + 110);
    return (start > 0 ? "…" : "") +
      escapeHtml(raw).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"),
        function (m) { return "<mark>" + m + "</mark>"; }) + "…";
  }

  function runSearch() {
    var q = searchEl.value.trim().toLowerCase();
    resultsEl.innerHTML = "";
    selected = -1;
    if (q.length < 2) { return; }

    var hits = [];
    INDEX.forEach(function (e) {
      var t = e.title.toLowerCase().indexOf(q);
      var h = e.hay.indexOf(q);
      if (t < 0 && h < 0) { return; }
      hits.push({ e: e, score: (t >= 0 ? 0 : 500) + (h < 0 ? 999 : h) });
    });
    hits.sort(function (a, b) { return a.score - b.score; });

    if (!hits.length) {
      var none = document.createElement("div");
      none.className = "noresult";
      none.textContent = "Nothing matches “" + searchEl.value.trim() + "”.";
      resultsEl.appendChild(none);
      return;
    }

    hits.slice(0, 20).forEach(function (hit) {
      var b = document.createElement("button");
      b.className = "result";
      b.type = "button";
      b.setAttribute("role", "option");

      var s = document.createElement("span");
      s.className = "rs";
      s.textContent = hit.e.section;
      var t = document.createElement("div");
      t.className = "rt";
      t.textContent = hit.e.title;
      b.appendChild(s);
      b.appendChild(t);

      var ex = excerpt(hit.e.hay, q);
      if (ex) {
        var x = document.createElement("span");
        x.className = "rx";
        x.innerHTML = ex;
        b.appendChild(x);
      }

      b.addEventListener("click", function () { go(hit.e.id); });
      resultsEl.appendChild(b);
    });
  }

  function closeSearch() {
    resultsEl.innerHTML = "";
    selected = -1;
  }

  searchEl.addEventListener("input", runSearch);
  searchEl.addEventListener("keydown", function (e) {
    var items = resultsEl.querySelectorAll(".result");
    if (e.key === "Escape") { searchEl.value = ""; closeSearch(); searchEl.blur(); return; }
    if (!items.length) { return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      selected += e.key === "ArrowDown" ? 1 : -1;
      if (selected < 0) { selected = items.length - 1; }
      if (selected >= items.length) { selected = 0; }
      items.forEach(function (it, i) { it.classList.toggle("sel", i === selected); });
      items[selected].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      e.preventDefault();
      (items[selected >= 0 ? selected : 0]).click();
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest(".searchwrap")) { closeSearch(); }
  });

  /* ── Keyboard shortcuts ───────────────────────────────────────────────── */
  document.addEventListener("keydown", function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "/" && !typing) { e.preventDefault(); searchEl.focus(); searchEl.select(); return; }
    if (typing) { return; }
    var i = ORDER.indexOf(current());
    if (e.key === "[" && i > 0) { go(ORDER[i - 1]); }
    if (e.key === "]" && i >= 0 && i < ORDER.length - 1) { go(ORDER[i + 1]); }
  });

  /* ── Mobile drawer ────────────────────────────────────────────────────── */
  var menubtn = document.getElementById("menubtn");
  menubtn.addEventListener("click", function () {
    var open = document.body.classList.toggle("nav-open");
    menubtn.setAttribute("aria-expanded", String(open));
  });
  document.getElementById("scrim").addEventListener("click", function () {
    document.body.classList.remove("nav-open");
    menubtn.setAttribute("aria-expanded", "false");
  });

  /* ── Routing ──────────────────────────────────────────────────────────── */
  function current() {
    var h = location.hash.replace(/^#\/?/, "");
    return PAGES[h] ? h : ORDER[0];
  }
  window.addEventListener("popstate", function () { render(current(), null); });
  window.addEventListener("hashchange", function () { render(current(), null); });

  /* ── Scroll-spy for the on-page contents ──────────────────────────────── */
  var spy;
  window.addEventListener("scroll", function () {
    if (spy) { return; }
    spy = requestAnimationFrame(function () {
      spy = null;
      var links = tocEl.querySelectorAll("a");
      var best = null;
      links.forEach(function (a) {
        var el = document.getElementById(a.getAttribute("href").slice(1));
        if (el && el.getBoundingClientRect().top < 120) { best = a; }
      });
      links.forEach(function (a) { a.classList.toggle("active", a === best); });
    });
  }, { passive: true });

  buildRail();
  render(current(), null);
})();
</script>
