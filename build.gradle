/* ─────────────────────────────────────────────────────────────────────────────
 *  FRCProgramming — offline curriculum project
 *  WPILib 2026.2.1 · Java 17 · JUnit 5 · desktop simulation enabled
 *
 *  You will touch this file roughly once per season. Everything that changes
 *  lesson-to-lesson lives in src/ and lessons/.
 *
 *  THE OFFLINE CONTRACT
 *  --------------------
 *  Every dependency named below resolves from the Maven repository that ships
 *  inside your WPILib install (see settings.gradle). Nothing here reaches the
 *  internet. That is deliberate and it is tested: `./gradlew build --offline`
 *  is the supported way to work, and `./tools/frcprog doctor` checks it.
 *
 *  If you add a vendordep later (PathPlanner, PhotonVision, AdvantageKit, …)
 *  you break that contract for exactly one build — the build that downloads it.
 *  See OFFLINE.md before you do, and see lessons/EXTENSIONS.md for which
 *  Stage 2 lessons need which vendordep.
 *
 *  THE LESSON TASK CONTRACT
 *  ------------------------
 *  Every lesson test carries two JUnit tags:  @Tag("lesson")  and
 *  @Tag("lesson-NN"). The plain `test` task EXCLUDES the "lesson" meta-tag, so
 *  `./gradlew build` is green on a fresh copy even though fifteen lessons are
 *  still unsolved. Per-lesson rubrics run through the generated `lessonNN`
 *  tasks, which this file builds from lessons/manifest.json at configuration
 *  time — add a lesson to the manifest and its Gradle task appears.
 * ───────────────────────────────────────────────────────────────────────────── */
plugins {
    id 'java'
    id 'edu.wpi.first.GradleRIO' version '2026.2.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// ─── Deploy (RoboRIO) ───────────────────────────────────────────────────────
// Present so the project is a real, deployable robot project rather than a toy.
// You will not use it during the curriculum — every lesson runs in simulation —
// but the day your team hands you a RoboRIO, this already works.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            team = project.frc.getTeamOrDefault(9999)
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

wpi.java.debugJni = false

// Desktop support ON. This is what lets `simulateJava` and `test` link against
// the desktop-classifier native libraries. Without it, nothing in this
// curriculum runs, because every lesson is a simulation lesson.
def includeDesktopSupport = true

dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    // 5.10.1 is the version that ships inside the WPILib Maven cache. Bumping
    // it is the single easiest way to accidentally break offline builds.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ─── The default `test` task ────────────────────────────────────────────────
// Runs everything EXCEPT lesson rubrics. Keeps `./gradlew build` green on a
// fresh copy so a student can prove their install works before writing code.
test {
    useJUnitPlatform {
        excludeTags 'lesson'
    }
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// ─── Simulation ─────────────────────────────────────────────────────────────
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
    options.encoding = 'UTF-8'
}

/* ═══════════════════════════════════════════════════════════════════════════
 *  LESSON MACHINERY
 *  Everything below this line is curriculum plumbing, not robot code.
 * ═══════════════════════════════════════════════════════════════════════════ */

import groovy.json.JsonSlurper
import groovy.json.JsonOutput

ext.manifestFile = file('lessons/manifest.json')
ext.lessonManifest = manifestFile.exists()
        ? new JsonSlurper().parseText(manifestFile.text)
        : [lessons: []]

// ─── Per-lesson rubric tasks ────────────────────────────────────────────────
// `./gradlew lesson01` runs only the tests tagged @Tag("lesson-01").
// Generated from the manifest, so a new lesson needs no edits here.
ext.lessonManifest.lessons.findAll { it.graded }.each { entry ->
    // "01-methods" -> id "01" -> task "lesson01" -> tag "lesson-01"
    def id = entry.id
    tasks.register("lesson${id}", Test) {
        group = 'lessons'
        description = "Rubric for lesson ${id} — ${entry.title}"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags "lesson-${id}"
        }
        systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        // Each lesson gets its own report directory so `frcprog check` can read
        // one lesson's results without racing another lesson's run.
        reports.junitXml.outputLocation = layout.buildDirectory.dir("test-results/lesson-${id}")
        reports.html.outputLocation = layout.buildDirectory.dir("reports/tests/lesson-${id}")
        // Deliberately silent. `frcprog check` reads the JUnit XML this task
        // writes and prints its own report, in which a failure is a sentence of
        // advice rather than a stack trace. Letting Gradle also dump the raw
        // output would bury that under forty lines a beginner cannot read.
        testLogging {
            events()
            showStandardStreams = false
            showStackTraces = false
            showExceptions = false
            showCauses = false
        }
        // Rubrics are graded, so never let Gradle skip one because "nothing
        // changed" — the student always wants to see the current verdict.
        outputs.upToDateWhen { false }
        wpi.java.configureTestTasks(it)
    }
}

// ─── `./gradlew lessonAll` — the local stand-in for CI ──────────────────────
// The online version of this curriculum would run every rubric in GitHub
// Actions and post a sticky PR comment. Offline, you run it yourself. It is
// expected to FAIL until you have finished every lesson; that is the point.
tasks.register('lessonAll', Test) {
    group = 'lessons'
    description = 'Run every lesson rubric (the offline replacement for CI)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'lesson' }
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/lesson-all')
    reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/lesson-all')
    ignoreFailures = true   // report the whole picture, don't stop at lesson 03
    outputs.upToDateWhen { false }
    wpi.java.configureTestTasks(it)
}

// ─── `./gradlew checkLessons` — content linter ──────────────────────────────
// The offline replacement for the CI markdown/rubric linter described in
// process/Path-B-Implementation.md §10.3. Validates that every lesson in the
// manifest has the files, fields, and README sections the template requires.
// Content authors run this; students never need to.
tasks.register('checkLessons') {
    group = 'lessons'
    description = 'Validate lesson manifests, required files, and README structure'
    doLast {
        def problems = []
        def requiredLessonJsonFields = [
            'slug', 'title', 'stage', 'prerequisites', 'estimatedMinutes'
        ]
        // Graded lessons additionally have to say what the student edits, which
        // JUnit classes grade it, and which tag those classes carry.
        def requiredGradedFields = ['tag', 'edits', 'tests']
        // Lessons are written as a to-do, not an essay: a hook, the steps, a
        // short why, and how you know you are finished.
        def requiredReadmeHeadings = ['## Do this', '## Done']
        def requiredGradedHeadings = ['## Check it', '## See it']

        if (!manifestFile.exists()) {
            throw new GradleException('lessons/manifest.json is missing')
        }

        def seenSlugs = [] as Set
        lessonManifest.lessons.each { entry ->
            def dir = file("lessons/${entry.dir}")
            def label = "lesson ${entry.id} (${entry.dir})"

            if (!dir.exists()) {
                problems << "${label}: directory lessons/${entry.dir} does not exist"
                return
            }
            ['README.md', 'hints.md', 'lesson.json'].each { name ->
                if (!new File(dir, name).exists()) {
                    problems << "${label}: missing ${name}"
                }
            }

            def lessonJsonFile = new File(dir, 'lesson.json')
            if (lessonJsonFile.exists()) {
                def lesson = new JsonSlurper().parseText(lessonJsonFile.text)
                def needed = entry.graded
                        ? requiredLessonJsonFields + requiredGradedFields
                        : requiredLessonJsonFields
                needed.each { f ->
                    if (lesson[f] == null) {
                        problems << "${label}: lesson.json is missing required field '${f}'"
                    }
                }
                if (entry.graded && lesson.tag != "lesson-${entry.id}") {
                    problems << "${label}: lesson.json tag '${lesson.tag}' should be 'lesson-${entry.id}'"
                }
                if (!seenSlugs.add(lesson.slug)) {
                    problems << "${label}: duplicate slug '${lesson.slug}'"
                }
                // Every file the lesson claims the student edits must exist,
                // otherwise `frcprog next` opens a path that isn't there.
                (lesson.edits ?: []).each { p ->
                    if (!file(p).exists()) {
                        problems << "${label}: edits references missing file ${p}"
                    }
                }
                // Every test class named in the rubric must exist on disk.
                (lesson.tests ?: []).each { fqcn ->
                    def path = 'src/test/java/' + fqcn.replace('.', '/') + '.java'
                    if (!file(path).exists()) {
                        problems << "${label}: tests references missing class ${fqcn} (${path})"
                    }
                }
                (lesson.prerequisites ?: []).each { pre ->
                    if (!lessonManifest.lessons.any { it.dir.endsWith(pre) || it.id == pre }) {
                        problems << "${label}: unknown prerequisite '${pre}'"
                    }
                }
            }

            def readme = new File(dir, 'README.md')
            if (readme.exists()) {
                def text = readme.text
                def headings = entry.graded
                        ? requiredReadmeHeadings + requiredGradedHeadings
                        : requiredReadmeHeadings
                headings.each { h ->
                    if (!text.contains(h)) {
                        problems << "${label}: README.md is missing a '${h}' section"
                    }
                }
                // Hint 4 (the answer) belongs in hints.md behind a <details>,
                // never in the README. See process/Curriculum-Flow.md Appendix B.
                if (text.contains('<details>')) {
                    problems << "${label}: README.md contains a <details> block — answers belong in hints.md"
                }
            }

            def hints = new File(dir, 'hints.md')
            if (hints.exists() && !hints.text.contains('<details>')) {
                problems << "${label}: hints.md has no collapsed <details> reference answer"
            }
        }

        if (problems) {
            problems.each { logger.error("  ✗ ${it}") }
            throw new GradleException("${problems.size()} lesson content problem(s) found")
        }
        logger.lifecycle("✓ ${lessonManifest.lessons.size()} lessons validated")
    }
}

// ─── `./gradlew lessonInfo` — machine-readable task list ────────────────────
// `frcprog` shells out to this when it needs to know what Gradle knows.
tasks.register('lessonInfo') {
    group = 'lessons'
    description = 'Print the lesson manifest as JSON (used by tools/frcprog)'
    doLast {
        println JsonOutput.toJson(lessonManifest)
    }
}
